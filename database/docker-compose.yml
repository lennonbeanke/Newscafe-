# Local DEVELOPMENT database only. Fake data only. Never used for production.
# Credentials come from database/.env (git-ignored, generated by scripts/gen-env.sh).
name: newscafe

services:
  db:
    image: postgres:17-alpine
    container_name: newscafe-db-dev
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run scripts/gen-env.sh first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-env.sh first}
      POSTGRES_DB: ${POSTGRES_DB:?run scripts/gen-env.sh first}
    ports:
      # Loopback only: the database is not reachable from other machines.
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - newscafe_pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200", "-c", "timezone=UTC"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  newscafe_pgdata:
