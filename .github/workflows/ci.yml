# Continuous checks only. There is NO deployment, NO publishing and NO secret in this workflow.
# It does nothing until the repository is pushed (which needs the owner's approval).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repo-safety:
    name: Repository safety (allow-list, boundaries, PDFs, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-repo.sh --tracked
      - run: scripts/check-boundaries.sh
      - run: scripts/scan-secrets.sh --tracked

  frontend:
    name: Frontend (lint, type-check, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  backend:
    name: Backend (database and API tests; fake data, throw-away container)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run db:up
      - run: npm run db:test
      - run: npm test

  e2e-parity:
    name: Frontend/backend parity (files only, no servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: (cd backend && npm ci --ignore-scripts)
      - run: node --test e2e/parity.test.mjs
